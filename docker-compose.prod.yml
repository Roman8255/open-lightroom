# Production stack behind Traefik (HTTPS via Let's Encrypt).
#   lightroom.dev      -> frontend (static build)
#   api.lightroom.dev  -> FastAPI backend
# Usage: cp .env.example .env  (set DOMAIN, ACME_EMAIL, SECRET_KEY, POSTGRES_PASSWORD)
#        docker compose -f docker-compose.prod.yml up -d --build
# DNS: A/AAAA records for ${DOMAIN} and api.${DOMAIN} must point at this host (ports 80/443 open).
services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openlr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openlr}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-openlr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openlr}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      STORAGE_DIR: /data
      CORS_ORIGINS: https://${DOMAIN:-lightroom.dev}
      COOKIE_SECURE: "true"
    volumes:
      - photos:/data
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${DOMAIN:-lightroom.dev}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=${CERT_RESOLVER:-le}
      # the API is mounted under /api internally; expose it at the root of api.<domain>
      - traefik.http.middlewares.api-prefix.addprefix.prefix=/api
      - traefik.http.routers.api.middlewares=api-prefix
      - traefik.http.services.api.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: https://api.${DOMAIN:-lightroom.dev}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN:-lightroom.dev}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.tls.certresolver=${CERT_RESOLVER:-le}
      - traefik.http.services.web.loadbalancer.server.port=80

volumes:
  pgdata:
  photos:
  letsencrypt:

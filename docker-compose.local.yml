# Run the production topology locally with the self-made certificate (no Let's Encrypt):
#   scripts/local-certs.sh && scripts/trust-local-ca.sh
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up --build
# -> https://lightroom.dev  and  https://api.lightroom.dev
# Set HTTP_PORT / HTTPS_PORT if 80/443 are taken on your machine (then use https://lightroom.dev:<port>,
# and rebuild the frontend with the matching API url).
services:
  traefik:
    command: !override
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/local-tls.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/local-tls.yml:/etc/traefik/local-tls.yml:ro
      - ./certs:/certs:ro
  backend:
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${DOMAIN:-lightroom.dev}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.middlewares.api-prefix.addprefix.prefix=/api
      - traefik.http.routers.api.middlewares=api-prefix
      - traefik.http.services.api.loadbalancer.server.port=8000
  frontend:
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN:-lightroom.dev}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.services.web.loadbalancer.server.port=80
